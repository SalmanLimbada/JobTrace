<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTrace Clipper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      max-height: 580px;
      overflow-y: auto;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 14px 16px;
      font-size: 12px;
    }
    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 3px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-icon {
      width: 18px;
      height: 18px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.2px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #8b949e;
    }
    input, select, textarea {
      width: 100%;
      background-color: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, background-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #58a6ff;
      background-color: #0d1117;
    }
    textarea {
      resize: vertical;
      min-height: 40px;
    }
    /* Requirements section */
    .reqs-container {
      margin-top: 4px;
      border: 1px solid #30363d;
      background: #161b22;
      border-radius: 6px;
      padding: 6px 8px;
      max-height: 130px;
      overflow-y: auto;
    }
    .req-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px solid #21262d;
      font-size: 11px;
      line-height: 1.4;
      color: #c9d1d9;
    }
    .req-item:last-child {
      border-bottom: none;
    }
    .req-bullet {
      color: #58a6ff;
      font-weight: bold;
    }
    .req-text {
      flex: 1;
    }
    .req-remove {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .req-remove:hover {
      color: #f85149;
    }
    .req-empty {
      color: #8b949e;
      font-size: 11px;
      font-style: italic;
      padding: 4px 0;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button.btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s;
      border: 1px solid transparent;
      text-align: center;
    }
    button.btn-primary {
      background-color: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #ffffff;
    }
    button.btn-primary:hover {
      background-color: #2ea043;
    }
    button.btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.btn-secondary {
      background-color: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    button.btn-secondary .btn-icon {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button.btn-secondary:hover {
      background-color: #30363d;
      color: #ffffff;
    }
    button.btn-secondary:hover .btn-icon {
      transform: rotate(180deg);
    }
    .status-msg {
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }
    .status-msg.success {
      display: block;
      background-color: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);
      color: #3fb950;
    }
    .status-msg.error {
      display: block;
      background-color: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #f85149;
    }
    .status-msg.info {
      display: block;
      background-color: rgba(88, 166, 255, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.35);
      color: #58a6ff;
    }
    .add-field-btn {
      background: none;
      border: none;
      color: #58a6ff;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .add-field-btn:hover {
      color: #79c0ff;
      text-decoration: underline;
    }
    .custom-field-row {
      margin-bottom: 8px;
    }
    .custom-field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .custom-field-header label {
      margin-bottom: 0;
    }
    .custom-field-delete {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 14px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s;
    }
    .custom-field-delete:hover {
      color: #f85149;
    }
    .duplicate-banner {
      background: rgba(210, 153, 34, 0.15);
      border: 1px solid rgba(210, 153, 34, 0.45);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.4;
    }
    .duplicate-banner-title {
      font-weight: 600;
      color: #f0883e;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }
    .duplicate-banner-text {
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon16.png" class="brand-icon" alt="">
      <span class="title">JobTrace</span>
    </div>
    <button type="button" id="toggleSettingsBtn" class="header-icon-btn" title="Configure Fields">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <!-- Duplicate Application Warning Banner -->
  <div id="duplicateBanner" class="duplicate-banner" style="display: none;">
    <div class="duplicate-banner-title">
      <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
      </svg>
      <span>Already Applied</span>
    </div>
    <div id="duplicateBannerText" class="duplicate-banner-text"></div>
  </div>

  <!-- Main Job Form View -->
  <form id="jobForm">
    <div class="form-group" id="companyGroup">
      <label for="company">Company *</label>
      <input type="text" id="company" placeholder="e.g. Acme Corp" required>
    </div>

    <div class="form-group" id="roleGroup">
      <label for="role">Role / Title *</label>
      <input type="text" id="role" placeholder="e.g. Software Engineer" required>
    </div>

    <div class="row-2" id="statusSalaryRow">
      <div class="form-group" id="statusGroup">
        <label for="status">Status</label>
        <select id="status">
          <option value="Applied" selected>Applied</option>
          <option value="Interview">Interview</option>
          <option value="Offer">Offer</option>
          <option value="Rejected">Rejected</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group" id="salaryGroup">
        <label for="salary">Salary</label>
        <input type="text" id="salary" placeholder="$120k - $140k">
      </div>
    </div>

    <div class="form-group" id="locationGroup">
      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Remote / New York, NY">
    </div>

    <div class="form-group" id="urlGroup">
      <label for="url">Posting URL</label>
      <input type="text" id="url" placeholder="https://...">
    </div>

    <!-- Dynamic Custom Fields Container -->
    <div id="customFieldsContainer"></div>

    <div class="form-group" id="reqsSection">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <label style="margin-bottom: 0;">Key Requirements</label>
        <span id="reqCount" style="font-size: 10px; color: #8b949e;">0 bullets</span>
      </div>
      <div class="reqs-container" id="reqsList">
        <div class="req-empty">No requirements detected yet.</div>
      </div>
    </div>

    <div class="form-group" id="notesGroup">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Recruiter name, referral info, interview stage..."></textarea>
    </div>

    <div class="btn-group">
      <button type="button" id="reCaptureBtn" class="btn btn-secondary" title="Re-scan current page">
        <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 8A6 6 0 1 1 8 2c2.5 0 4.6 1.5 5.5 3.6"/>
          <path d="M14 2v4h-4"/>
        </svg>
        <span>Re-scan</span>
      </button>
      <button type="submit" id="saveBtn" class="btn btn-primary">
        Save to JobTrace
      </button>
    </div>
  </form>

  <!-- Settings View: Configure Columns / Fields -->
  <div id="settingsView" style="display: none;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #30363d;">
      <span style="font-size: 12px; font-weight: 700; color: #f0f6fc;">Configure Fields</span>
      <button type="button" id="closeSettingsBtn" class="btn btn-secondary" style="padding: 3px 8px; font-size: 11px;">← Done</button>
    </div>

    <div style="margin-bottom: 14px;">
      <label style="font-size: 10px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;">
        Standard Fields
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px;">
        <label style="display: flex; align-items: center; gap: 8px; color: #c9d1d9; cursor: pointer; font-size: 12px;">
          <input type="checkbox" id="settingSalary" style="width: auto;" checked>
          <span>Salary</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: #c9d1d9; cursor: pointer; font-size: 12px;">
          <input type="checkbox" id="settingLocation" style="width: auto;" checked>
          <span>Location</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: #c9d1d9; cursor: pointer; font-size: 12px;">
          <input type="checkbox" id="settingUrl" style="width: auto;" checked>
          <span>Posting URL</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: #c9d1d9; cursor: pointer; font-size: 12px;">
          <input type="checkbox" id="settingReqs" style="width: auto;" checked>
          <span>Key Requirements</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: #c9d1d9; cursor: pointer; font-size: 12px;">
          <input type="checkbox" id="settingNotes" style="width: auto;" checked>
          <span>Notes</span>
        </label>
      </div>
    </div>

    <div>
      <label style="font-size: 10px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;">
        Custom Fields
      </label>
      <div id="settingsCustomFieldsList" style="margin-bottom: 8px;"></div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="newCustomFieldNameInput" placeholder="Add field (e.g. Referral)" style="flex: 1; font-size: 11px; padding: 5px 8px;">
        <button type="button" id="addCustomFieldBtn" class="btn btn-primary" style="padding: 5px 10px; font-size: 11px; flex: 0 0 auto;">+ Add</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
