<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to Job Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #f0f6fc;
    }
    .tag {
      font-size: 10px;
      background: #21262d;
      border: 1px solid #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #8b949e;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #8b949e;
    }
    input, select, textarea {
      width: 100%;
      background-color: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #58a6ff;
    }
    textarea {
      resize: vertical;
      height: 48px;
    }
    button.submit-btn {
      width: 100%;
      background-color: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      color: #ffffff;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.15s;
    }
    button.submit-btn:hover {
      background-color: #2ea043;
    }
    button.submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      text-align: center;
    }
    .status-msg.success {
      display: block;
      background-color: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);
      color: #3fb950;
    }
    .status-msg.error {
      display: block;
      background-color: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #f85149;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">JobTrace</span>
    <span class="tag">v1.0</span>
  </div>

  <form id="jobForm">
    <div class="form-group">
      <label for="company">Company</label>
      <input type="text" id="company" placeholder="e.g. Google" required>
    </div>

    <div class="form-group">
      <label for="role">Role / Job Title</label>
      <input type="text" id="role" placeholder="e.g. Software Engineer" required>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status">
        <option value="Applied" selected>Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="url">Job URL</label>
      <input type="text" id="url" placeholder="https://...">
    </div>

    <div class="form-group">
      <label for="notes">Notes (optional)</label>
      <textarea id="notes" placeholder="Salary, recruiter name, etc."></textarea>
    </div>

    <button type="submit" id="saveBtn" class="submit-btn">Save to Tracker</button>
  </form>

  <div id="statusMsg" class="status-msg"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
